-- ============================================================================
--  level_skills.cfg  (non-combat skills only, 30)
--  Generated 2026-10-20 for KCD2 1.5.6. Same mechanism as pcr.cfg: plain Lua lines run from the console.
--  Put this file in the game folder (next to the Bin folder, NOT in Mods).
--  Load a save, open the console (~) and type:   exec level_skills.cfg
--  Each line only RAISES a level: if Henry is already at or above the target, the line does nothing.
--  Needs StatCap/SkillCap at 50 (skillcap50, statcap50 and Galahad all set that); targets here stay at or under 50.
--  EXPERIMENTAL: not yet tested in game. Back up your Saved Games first. Levels cannot be lowered afterwards.
--  Skill names come from Galahad's skill_teacher table (every name below is used there). Stat names are the four
--  the cheat mod accepts. If a name is wrong, that one line logs a Lua error and the rest still run.
-- ============================================================================

-- ================= SKILLS (level 30) =================
-- Alchemy
#if player.soul:GetSkillLevel('alchemy') < 30 then player.soul:AdvanceToSkillLevel('alchemy', 30) end
-- Craftsmanship
#if player.soul:GetSkillLevel('craftsmanship') < 30 then player.soul:AdvanceToSkillLevel('craftsmanship', 30) end
-- Horse riding
#if player.soul:GetSkillLevel('horse_riding') < 30 then player.soul:AdvanceToSkillLevel('horse_riding', 30) end
-- Scholarship
#if player.soul:GetSkillLevel('scholarship') < 30 then player.soul:AdvanceToSkillLevel('scholarship', 30) end
-- Stealth
#if player.soul:GetSkillLevel('stealth') < 30 then player.soul:AdvanceToSkillLevel('stealth', 30) end
-- Survival
#if player.soul:GetSkillLevel('survival') < 30 then player.soul:AdvanceToSkillLevel('survival', 30) end
-- Thievery
#if player.soul:GetSkillLevel('thievery') < 30 then player.soul:AdvanceToSkillLevel('thievery', 30) end

-- done. Open the character screen to check the new levels, then quicksave.
