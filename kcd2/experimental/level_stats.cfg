-- ============================================================================
--  level_stats.cfg  (main stats only, 30)
--  Generated 2026-10-20 for KCD2 1.5.6. Same mechanism as pcr.cfg: plain Lua lines run from the console.
--  Put this file in the game folder (next to the Bin folder, NOT in Mods).
--  Load a save, open the console (~) and type:   exec level_stats.cfg
--  Each line only RAISES a level: if Henry is already at or above the target, the line does nothing.
--  Needs StatCap/SkillCap at 50 (skillcap50, statcap50 and Galahad all set that); targets here stay at or under 50.
--  EXPERIMENTAL: not yet tested in game. Back up your Saved Games first. Levels cannot be lowered afterwards.
--  Skill names come from Galahad's skill_teacher table (every name below is used there). Stat names are the four
--  the cheat mod accepts. If a name is wrong, that one line logs a Lua error and the rest still run.
-- ============================================================================

-- ================= MAIN STATS (level 30) =================
-- Strength
#if player.soul:GetStatLevel('strength') < 30 then player.soul:AdvanceToStatLevel('strength', 30) end
-- Agility
#if player.soul:GetStatLevel('agility') < 30 then player.soul:AdvanceToStatLevel('agility', 30) end
-- Vitality
#if player.soul:GetStatLevel('vitality') < 30 then player.soul:AdvanceToStatLevel('vitality', 30) end
-- Speech
#if player.soul:GetStatLevel('speech') < 30 then player.soul:AdvanceToStatLevel('speech', 30) end

-- done. Open the character screen to check the new levels, then quicksave.
