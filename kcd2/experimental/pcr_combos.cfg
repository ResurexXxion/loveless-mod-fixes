-- ============================================================================
--  pcr_combos.cfg  (Combos only)
--  Generated 2026-10-18, rechecked 2026-10-20 for KCD2 1.5.6 against one 130-mod setup (lovelessgaming.com/mods/kcd2/); lines for mods you don't have just log an error
--  Perks, combos and recipes from the base game plus that setup's mods (Galahad, Reforge Everything, Cooking, Legendary Swords and others).
--  Put this file in the game folder (next to KingdomCome's Bin folder, NOT in Mods)
--  Load a save, open the console (~) and type:   exec pcr_combos.cfg
--  Same mechanism and line format as the addallCombos mod (Nexus 2809).
--  EXPERIMENTAL: not yet tested in game. Back up your Saved Games first. Cannot be undone from here.
-- ==========================================================================

