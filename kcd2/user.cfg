-- user.cfg for a heavily modded Kingdom Come: Deliverance II (game 1.5.6)
-- From Loveless Gaming (lovelessgaming.com/mods/kcd2/). MIT licensed; the settings themselves are the game's own console variables.
--
-- Put this file in the game folder (next to the Bin folder). It loads after every mod's mod.cfg, so these values win.
-- It folds five small "config-only" mods into one file, so you can disable those mods and free up mod-folder slots
-- (useful once you're near the ~120-130 mod limit; see Mod Limit Fix on Nexus).
-- Comments use -- ; keep notes off the value lines (the game logs them as invalid).
-- Back up your existing user.cfg first. Some mods (e.g. "view distance without flicker") deploy their own user.cfg:
-- if you use one of those, merge the lines instead of replacing the file.

-- ===== From the mod "view distance without flicker" (credit to its author) =====
-- e_ViewDistMin: default is 5; 30 works better in daytime, breaks lighting at night
e_ViewDistMin=30
-- e_ViewDistRatio: default 180; more detail in the distance
e_ViewDistRatio=200
-- e_ViewDistRatioLights: default 30; longer draw distance of shadows at night
e_ViewDistRatioLights=55
-- r_ShadowCastingLightsMaxCount: default 32; more lights cast shadows
r_ShadowCastingLightsMaxCount=40
-- e_MergedMeshesViewDistRatio: default 200; longer draw distance of vegetation
e_MergedMeshesViewDistRatio=300
-- e_LodFaceAreaTargetSize: default 0.0006; LODs change further away
e_LodFaceAreaTargetSize=0.0008
-- e_TerrainDetailMaterialsViewDistZ: default 100; more terrain LOD
e_TerrainDetailMaterialsViewDistZ=300

-- ===== Extra settings =====
-- no bloom (FFML sets this too; one copy is enough)
r_HDRBloom=0
-- log detail: 3 is enough to diagnose most problems; 4 is chattier
log_verbosity=3
-- replaces the VerticalLightFix mod (that mod is only this one setting)
wh_e_VerticalLightCulling=2
-- skip the startup logo videos
wh_sys_SkipStartupVideoWhenPossible=1

-- ===== Folded from the mod "Enable Async Compute" by ChemBoy1 (also set by "Darker Shadows And AO") =====
e_svoTI_AsyncCompute=1

-- ===== Folded from the mod "Disable Interior Light Fog" by ChemBoy1 =====
r_VolumetricFogMinimumLightBulbSize=0

-- ===== Folded from the mod "Darker Shadows And AO" by TheManualEnhancer =====
e_svoTI_Saturation=0.95
e_svoTI_SSAOAmount=1.105
e_svoTI_MinVoxelOpacity=0.005
e_svoTI_SkyColorMultiplier=0.666
e_svoTI_TranslucentBrightness=0.666
e_svoTI_Troposphere_Active=1
e_svoTI_Troposphere_Density=0.75
e_svoTI_VoxelOpacityMultiplier=1.15
r_ssdoAmountAmbient=2.1
r_ssdoColorBleeding=0.666
r_ssdoHalfRes=0
r_ssdoRadius=0.05
r_ssdoRadiusMax=0.5
e_ShadowsBlendCascadesVal=0.5
r_Contrast=0.525
-- off in the original mod (left off):
-- e_ShadowsCacheExtendLastCascade=1
-- e_VolObjShadowStrength=0.5
-- r_ShadowJittering=3
-- r_ShadowJitteringMultiplierWH=1.2
-- r_ShadowsAdaptionMin=0.4

-- ===== "realistic_horse_handling": not here on purpose =====
-- Its four wh_horse_Rotation* settings log "Unknown command" when user.cfg is read (they register later), and they are
-- cheat-flagged, so they only work with the game launched with -devmode. Set them from a ModConfigs cfg run by
-- "Auto Exec Cfgs On Spawn" instead.

-- ===== Folded from the mod "FFML" by FORLE (memory, streaming, post-processing) =====
-- VRAM budget in MB: set it to about 80% of your graphics card's memory (8192 suits a 10 GB card)
sys_budget_videomem=8192
-- system RAM budget in MB (16384 = 16 GB; keep it at or under about half your RAM)
sys_budget_sysmem=16384
-- UI-related unload
wh_ui_ApseUnloadMode=1
-- mouse smoothing off
i_mouse_smooth=0
-- streaming cache for data from .pak files
sys_PakStreamCache=1
r_TexturesStreamingMaxRequestedMB=4096
-- 1 skips the highest mip; 0 = full sharpness (needs more VRAM)
r_texturesstreamingSkipMips=1
r_texturesstreamingMinUsableMips=1
r_DepthOfField=0
r_sharpening=0
r_HDRVignetting=0
r_MotionBlur=0
r_ChromaticAberration=0

-- ===== Reforge Everything (Nexus 2884) =====
-- re_color is a console command the mod registers, and the mod re-runs this file after it loads.
-- One "unknown command" line for it at the very first read is harmless. 1 = also show alternate-colour recipes (default 0).
-- Remove this line if you don't use Reforge Everything.
re_color 1

